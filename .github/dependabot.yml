version: 2

# GitHub Actions, pre-commit hooks and the Terraform and TFLint versions arrive
# as one monthly PR, which dependabot-automerge.yml merges when every update is
# minor or patch.
multi-ecosystem-groups:
  tooling:
    schedule:
      interval: "monthly"
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"
    cooldown:
      default-days: 7

  # Not built images: the tags in .github/terraform/Dockerfile and
  # .github/tflint/Dockerfile are the Terraform and TFLint versions
  # terraform-validate.yml installs, tested by its self-test.
  - package-ecosystem: "docker"
    directories:
      - "/.github/terraform"
      - "/.github/tflint"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"
    cooldown:
      default-days: 7
