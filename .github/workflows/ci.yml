---
# Self-test: audit this repo's workflows and dogfood the reusable ones.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    uses: $/.github/workflows/zizmor.yml
  markdownlint:
    uses: $/.github/workflows/markdownlint.yml
  shell-lint:
    uses: $/.github/workflows/shell-lint.yml
  shell-lint-paths:
    uses: $/.github/workflows/shell-lint.yml
    with:
      paths: "tests/**/*.sh"
  docker-publish:
    # A called workflow can't get more permissions than its caller grants, and
    # GitHub checks this even for the push job that publish: false skips.
    permissions:
      contents: read
      packages: write  # required by the (skipped) push job
      id-token: write  # required by the (skipped) push job
      attestations: write  # required by the (skipped) push job
    uses: $/.github/workflows/docker-publish.yml
    with:
      image-name: fixture
      context: tests/fixtures/docker
      test-command: docker run --rm "$IMAGE" hello | grep -qx hello
      test-platforms: '["linux/amd64", "linux/arm64"]'
      publish: false
