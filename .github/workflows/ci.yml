---
# Self-test: audit this repo's workflows and dogfood the reusable ones.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    uses: $/.github/workflows/zizmor.yml
  markdownlint:
    uses: $/.github/workflows/markdownlint.yml
  pre-commit:
    uses: $/.github/workflows/pre-commit.yml
  dependabot-automerge:
    # Merges this repo's own Dependabot PRs; skipped on every other PR and push
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/dependabot-automerge.yml
  shell-lint:
    uses: $/.github/workflows/shell-lint.yml
  shell-lint-paths:
    uses: $/.github/workflows/shell-lint.yml
    with:
      paths: "tests/**/*.sh"
  docker-publish:
    # A called workflow can't get more permissions than its caller grants, and
    # GitHub checks this even for the push job that publish: false skips.
    permissions:
      contents: read
      packages: write  # required by the (skipped) push job
      id-token: write  # required by the (skipped) push job
      attestations: write  # required by the (skipped) push job
    uses: $/.github/workflows/docker-publish.yml
    with:
      image-name: fixture
      context: tests/fixtures/docker
      test-command: docker run --rm "$IMAGE" hello | grep -qx hello
      test-platforms: '["linux/amd64", "linux/arm64"]'
      publish: false
  scheduled-failure-issue:
    # Acts only on scheduled runs, so here this checks that the call is valid
    permissions:
      issues: write  # required by the (skipped) issue job
    uses: $/.github/workflows/scheduled-failure-issue.yml
    with:
      failed: false
  terraform-validate:
    uses: $/.github/workflows/terraform-validate.yml
    with:
      working-directory: tests/fixtures/terraform
      lockfile-readonly: true
      validate-env: '{"TF_IN_AUTOMATION": "1"}'
