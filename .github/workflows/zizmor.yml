---
# Reusable zizmor workflow. Callers keep their own triggers, concurrency and
# .github/zizmor.yml config; this file owns the job itself.
name: zizmor

on:
  workflow_call:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest  # zizmor-action needs Docker, which ubuntu-slim lacks
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          # Pinned so a new zizmor release can't fail every caller at once.
          # Dependabot doesn't update it; bump it with the zizmor-pre-commit hook.
          version: "1.30.1"
          advanced-security: false
          annotations: true
