---
# Reusable zizmor workflow. Callers keep their own triggers, concurrency and
# .github/zizmor.yml config; this file owns the job itself.
name: zizmor

on:
  workflow_call:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest  # zizmor-action needs Docker, which ubuntu-slim lacks
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        # No version input: the default, latest, is the newest zizmor pinned in
        # this action release, so a new zizmor release can't fail every caller
        # at once, and Dependabot's bump of the action is the zizmor upgrade.
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b  # v0.8.0
        with:
          advanced-security: false
          annotations: true
