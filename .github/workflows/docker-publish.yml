---
# Reusable Docker image build, test and publish. The test job builds the image
# for each test platform and runs the caller's test command against it. On a
# push to the default branch, the push job builds for every platform, pushes to
# Docker Hub and GHCR, and attests build provenance in both registries.
#
# The caller's job must grant: contents: read, packages: write,
# id-token: write, attestations: write.
name: docker-publish

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name, used for docker.io/<DOCKERHUB_USERNAME>/<name> and ghcr.io/<owner>/<name>
        type: string
        required: true
      test-command:
        description: >-
          Shell command that tests the image. $IMAGE holds the local image tag,
          and docker run defaults to the platform under test.
        type: string
        required: true
      test-platforms:
        description: JSON array of platforms to build and test on (non-amd64 runs under QEMU)
        type: string
        default: '["linux/amd64"]'
      platforms:
        description: Comma-separated platforms to publish
        type: string
        default: "linux/amd64,linux/arm64"
      context:
        description: Docker build context
        type: string
        default: "."
      build-args:
        description: Newline-separated build arguments (KEY=value)
        type: string
        default: ""
      tags:
        description: >-
          docker/metadata-action tags rules (newline-separated). Empty keeps the
          action's defaults (the branch name); latest is always added.
        type: string
        default: ""
      publish:
        description: Push and attest on a push to the default branch. Set false to only build and test.
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions: {}

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.test-platforms) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          load: true
          tags: ${{ inputs.image-name }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Test
        env:
          IMAGE: ${{ inputs.image-name }}
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: eval "$TEST_COMMAND"

  push:
    name: push
    needs: test
    if: >-
      inputs.publish && github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push to GHCR with GITHUB_TOKEN
      id-token: write  # sign the provenance attestations
      attestations: write  # store the attestations
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          flavor: latest=true
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: ${{ inputs.tags }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Docker Hub image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
