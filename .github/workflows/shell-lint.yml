---
# Reusable shell script lint: shellcheck and shfmt. Both are installed by the
# SHA-pinned taiki-e/install-action, which picks the newest version in its
# bundled, checksummed manifests, so Dependabot's bump of the action is also
# the tool upgrade; there's no version to maintain here. By default, files are
# discovered with `shfmt -f .`, which matches by extension and shebang and
# includes .bats files.
name: shell-lint

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Space-separated files or globs (globstar enabled) to check instead of
          auto-discovery. A glob that matches nothing fails the run.
        type: string
        default: ""
      shfmt-flags:
        description: Formatting flags passed to shfmt
        type: string
        default: "-i 2 -sr -ci"

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # shfmt is needed here too, for file discovery
      - name: Install shellcheck and shfmt
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: shellcheck,shfmt
          fallback: none

      - name: Find shell files
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -n "$PATHS" ]; then
            shopt -s globstar failglob
            # Word-split and glob-expand the caller's list on purpose
            # shellcheck disable=SC2206
            files=($PATHS)
          else
            mapfile -t files < <(shfmt -f .)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell files found; set the paths input"
            exit 1
          fi
          printf '%s\n' "${files[@]}" | tee "$RUNNER_TEMP/files.txt"

      - name: Run shellcheck
        run: |
          shellcheck --version
          xargs -d '\n' -a "$RUNNER_TEMP/files.txt" shellcheck

  shfmt:
    name: shfmt
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: shfmt
          fallback: none

      - name: Find shell files
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -n "$PATHS" ]; then
            shopt -s globstar failglob
            # Word-split and glob-expand the caller's list on purpose
            # shellcheck disable=SC2206
            files=($PATHS)
          else
            mapfile -t files < <(shfmt -f .)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell files found; set the paths input"
            exit 1
          fi
          printf '%s\n' "${files[@]}" | tee "$RUNNER_TEMP/files.txt"

      - name: Run shfmt
        env:
          SHFMT_FLAGS: ${{ inputs.shfmt-flags }}
        run: |
          shfmt --version
          # SHFMT_FLAGS is split into separate flags on purpose
          # shellcheck disable=SC2086
          xargs -d '\n' -a "$RUNNER_TEMP/files.txt" shfmt $SHFMT_FLAGS -d
