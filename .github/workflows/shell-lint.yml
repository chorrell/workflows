---
# Reusable shell script lint: shellcheck and shfmt at pinned, checksum-verified
# versions (keep them in step with the callers' pre-commit hooks). By default,
# files are discovered with `shfmt -f .`, which matches by extension and shebang
# and includes .bats files.
name: shell-lint

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Space-separated files or globs (globstar enabled) to check instead of
          auto-discovery. A glob that matches nothing fails the run.
        type: string
        default: ""
      shfmt-flags:
        description: Formatting flags passed to shfmt
        type: string
        default: "-i 2 -sr -ci"

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
  SHFMT_VERSION: "3.14.1"
  SHFMT_SHA256: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # shfmt is needed here too, for file discovery
      - name: Install shfmt
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $RUNNER_TEMP/bin/shfmt" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/shfmt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"

      - name: Find shell files
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -n "$PATHS" ]; then
            shopt -s globstar failglob
            # Word-split and glob-expand the caller's list on purpose
            # shellcheck disable=SC2206
            files=($PATHS)
          else
            mapfile -t files < <(shfmt -f .)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell files found; set the paths input"
            exit 1
          fi
          printf '%s\n' "${files[@]}" | tee "$RUNNER_TEMP/files.txt"

      - name: Run shellcheck
        run: |
          shellcheck --version
          xargs -d '\n' -a "$RUNNER_TEMP/files.txt" shellcheck

  shfmt:
    name: shfmt
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $RUNNER_TEMP/bin/shfmt" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/shfmt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Find shell files
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -n "$PATHS" ]; then
            shopt -s globstar failglob
            # Word-split and glob-expand the caller's list on purpose
            # shellcheck disable=SC2206
            files=($PATHS)
          else
            mapfile -t files < <(shfmt -f .)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell files found; set the paths input"
            exit 1
          fi
          printf '%s\n' "${files[@]}" | tee "$RUNNER_TEMP/files.txt"

      - name: Run shfmt
        env:
          SHFMT_FLAGS: ${{ inputs.shfmt-flags }}
        run: |
          shfmt --version
          # SHFMT_FLAGS is split into separate flags on purpose
          # shellcheck disable=SC2086
          xargs -d '\n' -a "$RUNNER_TEMP/files.txt" shfmt $SHFMT_FLAGS -d
